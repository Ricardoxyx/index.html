<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Enigma para Taís</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: 'Poppins', sans-serif;
      color: white;
    }

    #enigma, #mensagem {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 30%;
      padding: 0 20px;
      animation: slideIn 2s ease;
    }

    #enigma h2 {
      font-size: 24px;
      font-weight: 600;
      color: #ffc0cb;
      text-shadow: 1px 1px 2px #ff69b4;
    }

    #enigma input, #enigma button {
      margin-top: 15px;
      padding: 10px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
    }

    #enigma input {
      width: 60%;
      background: #fff;
    }

    #enigma button {
      background-color: #ff69b4;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }

    #enigma button:hover {
      background-color: #ff85c1;
    }

    #mensagem {
      display: none;
      font-size: 26px;
      color: #fff;
      text-shadow: 2px 2px 4px #ff69b4;
      animation: fadeIn 2s ease-in-out;
    }

    #mensagem h1 {
      font-size: 32px;
      animation: wave 2s infinite alternate;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes wave {
      0% { transform: rotate(-1deg); }
      100% { transform: rotate(1deg); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .estrela {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: brilho 2s infinite;
    }

    @keyframes brilho {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    .coracao {
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      transform: rotate(45deg);
      animation: subir 5s linear infinite;
    }

    .coracao::before, .coracao::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
    }

    .coracao::before {
      top: -10px;
      left: 0;
    }

    .coracao::after {
      left: -10px;
      top: 0;
    }

    @keyframes subir {
      0% {
        bottom: 0;
        opacity: 1;
      }
      100% {
        bottom: 100%;
        opacity: 0;
      }
    }
  </style>
</head>
<body>

<div id="enigma">
  <h2>Qual é o nome da garota mais especial do mundo que faz aniversário hoje?</h2>
  <input type="text" id="resposta" placeholder="Digite aqui">
  <br>
  <button onclick="verificar()">Desbloquear</button>
</div>

<div id="mensagem">
  <h1>Te amo, Taís. Feliz Aniversário. Brilhe como o universo!</h1>
</div>

<script>
  // Estrelas
  for (let i = 0; i < 100; i++) {
    const estrela = document.createElement("div");
    estrela.className = "estrela";
    estrela.style.left = `${Math.random() * 100}%`;
    estrela.style.top = `${Math.random() * 100}%`;
    estrela.style.animationDelay = `${Math.random() * 3}s`;
    document.body.appendChild(estrela);
  }

  function verificar() {
    const resposta = document.getElementById("resposta").value.trim().toLowerCase();
    if (resposta === "taís" || resposta === "Taís") {
      document.getElementById("enigma").style.display = "none";
      document.getElementById("mensagem").style.display = "block";

      // corações
      setInterval(() => {
        const coracao = document.createElement("div");
        coracao.className = "coracao";
        coracao.style.left = `${Math.random() * 100}%`;
        document.body.appendChild(coracao);
        setTimeout(() => coracao.remove(), 5000);
      }, 300);
    } else {
      alert("Hmm... tente de novo!");
    }
  }
</script>

</body>
</html>
